// We are using the latest syntax standard
syntax = "proto3";

// This tells the compiler to output the generated Go files into a folder named "pb"
option go_package = "./pb";

package auth;

// The Service defines the "functions" you can call remotely
service AuthService {
  rpc ValidateToken (TokenRequest) returns (TokenResponse);
}

// Messages define the exact data structures (like Go structs)
// The "= 1", "= 2" are unique binary tags used for serialization, NOT values!
message TokenRequest {
  string api_key = 1;
}

message TokenResponse {
  bool is_valid = 1;
  string user_id = 2;
}