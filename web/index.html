<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL shortener</title>
<style>
  :root {
    --bg: #f7f6f1;
    --surface: #ffffff;
    --ink: #191b18;
    --muted: #5a5f56;
    --line: #dcdad2;
    --line-strong: #7a7f74;
    --accent: #1f5f46;
    --accent-ink: #ffffff;
    --danger: #a32a2a;
    --focus: #1f5f46;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #131613;
    --surface: #1b1f1b;
    --ink: #eef0e9;
    --muted: #a6ac9f;
    --line: #2c332c;
    --line-strong: #7d877b;
    --accent: #79cf9f;
    --accent-ink: #101a13;
    --danger: #f2a1a1;
    --focus: #9fe0ba;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }
  main {
    width: min(100% - 2.5rem, 44rem);
    margin-inline: auto;
    padding-block: clamp(2.5rem, 8vh, 5.5rem) 5rem;
  }
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 1.3rem + 2vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .lede {
    margin: 0.6rem 0 0;
    max-width: 44ch;
    color: var(--muted);
  }
  .block { margin-top: clamp(2rem, 6vw, 3rem); }
  .block-separated {
    border-top: 1px solid var(--line);
    padding-top: clamp(1.75rem, 5vw, 2.5rem);
  }
  h2 {
    margin: 0 0 0.75rem;
    font-size: 1.0625rem;
    font-weight: 600;
  }
  label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.875rem;
    font-weight: 600;
  }
  .field-row {
    display: flex;
    gap: 0.5rem;
  }
  input {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    min-height: 44px;
    padding: 0.6rem 0.8rem;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
  }
  input::placeholder { color: var(--muted); opacity: 1; }
  button {
    min-height: 44px;
    padding: 0.6rem 1rem;
    font: inherit;
    font-size: 0.9375rem;
    font-weight: 600;
    white-space: nowrap;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.94); }
  button:disabled { opacity: 0.65; cursor: progress; filter: none; }
  .ghost {
    color: var(--ink);
    background: transparent;
    border-color: var(--line-strong);
  }
  .ghost:hover { background: var(--surface); }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  .result {
    margin-top: 1rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .result-label {
    margin: 0 0 0.35rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  #short-link {
    flex: 1 1 auto;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 1.0625rem;
    word-break: break-all;
  }
  .qr-block { margin-top: 1rem; }
  .qr {
    display: block;
    width: 128px;
    height: 128px;
    padding: 6px;
    /* Kept white with dark modules so the code scans in either theme. */
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .hint {
    margin: 0.45rem 0 0;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .status {
    min-height: 1.25rem;
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .status.error { color: var(--danger); }
  .empty {
    margin: 1.25rem 0 0;
    font-size: 0.9375rem;
    color: var(--muted);
  }
  dl { margin: 1.25rem 0 0; display: grid; gap: 0.85rem; }
  dl > div {
    display: grid;
    grid-template-columns: 8.5rem 1fr;
    gap: 0.75rem;
  }
  dt { font-size: 0.875rem; color: var(--muted); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 34rem) {
    .field-row { flex-direction: column; }
    .field-row button, .result-row button { width: 100%; }
    .result-row { flex-direction: column; align-items: stretch; }
    dl > div { grid-template-columns: 1fr; gap: 0.1rem; }
  }
</style>
<script>
  (function () {
    var saved;
    try { saved = localStorage.getItem("theme"); } catch (error) { saved = null; }
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<main>
  <header class="page-head">
    <h1>URL shortener</h1>
    <button type="button" class="ghost" id="theme-toggle">Dark</button>
  </header>
  <p class="lede">Paste a long URL and get a six-character link. Every visit is counted.</p>

  <section class="block" aria-labelledby="shorten-title">
    <h2 id="shorten-title">Shorten a link</h2>
    <form id="shorten-form">
      <label for="long-url">Long URL</label>
      <div class="field-row">
        <input id="long-url" name="long_url" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="example.com/a/long/path" required>
        <button type="submit" id="shorten-submit">Shorten URL</button>
      </div>
      <p class="status" id="shorten-status" role="status" aria-live="polite"></p>
    </form>

    <div class="result" id="shorten-result" hidden>
      <p class="result-label">Short link</p>
      <div class="result-row">
        <a id="short-link" href="#"></a>
        <button type="button" class="ghost" id="copy-button">Copy</button>
      </div>
      <p class="status" id="copy-status" role="status" aria-live="polite"></p>
      <div class="qr-block">
        <img id="short-qr" class="qr" width="128" height="128" alt="">
        <p class="hint">Scan to open the short link.</p>
      </div>
    </div>
  </section>

  <section class="block block-separated" aria-labelledby="stats-title">
    <h2 id="stats-title">Clicks</h2>
    <form id="stats-form">
      <label for="stats-code">Short code or short link</label>
      <div class="field-row">
        <input id="stats-code" name="code" type="text" autocomplete="off" spellcheck="false" placeholder="abc123" required aria-describedby="stats-hint">
        <button type="submit" id="stats-submit">Check clicks</button>
      </div>
      <p class="hint" id="stats-hint">Use the six-character code, or paste the whole short link.</p>
      <p class="status" id="stats-status" role="status" aria-live="polite"></p>
    </form>

    <p class="empty" id="stats-empty">Nothing checked yet. Enter a code to see its click count.</p>
    <div id="stats-result" aria-live="polite" hidden>
      <dl>
        <div>
          <dt>Destination</dt>
          <dd><a id="stats-url"></a></dd>
        </div>
        <div>
          <dt>Clicks</dt>
          <dd id="stats-clicks"></dd>
        </div>
        <div>
          <dt>Created</dt>
          <dd id="stats-created"></dd>
        </div>
      </dl>
    </div>
  </section>
</main>

<script>
  (function () {
    "use strict";

    var root = document.documentElement;
    var themeButton = document.getElementById("theme-toggle");
    var shortenForm = document.getElementById("shorten-form");
    var longUrlInput = document.getElementById("long-url");
    var shortenSubmit = document.getElementById("shorten-submit");
    var shortenStatus = document.getElementById("shorten-status");
    var shortenResult = document.getElementById("shorten-result");
    var shortLink = document.getElementById("short-link");
    var copyButton = document.getElementById("copy-button");
    var copyStatus = document.getElementById("copy-status");
    var shortQR = document.getElementById("short-qr");
    var statsForm = document.getElementById("stats-form");
    var statsCodeInput = document.getElementById("stats-code");
    var statsSubmit = document.getElementById("stats-submit");
    var statsStatus = document.getElementById("stats-status");
    var statsEmpty = document.getElementById("stats-empty");
    var statsResult = document.getElementById("stats-result");
    var statsUrl = document.getElementById("stats-url");
    var statsClicks = document.getElementById("stats-clicks");
    var statsCreated = document.getElementById("stats-created");
    var copyTimer = null;

    function isDark() {
      return root.dataset.theme === "dark";
    }

    function syncThemeButton() {
      themeButton.textContent = isDark() ? "Light" : "Dark";
      themeButton.setAttribute("aria-label", isDark() ? "Switch to light theme" : "Switch to dark theme");
    }

    themeButton.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (error) {}
      syncThemeButton();
    });

    function setMessage(element, text, isError) {
      element.textContent = text;
      element.classList.toggle("error", Boolean(isError));
    }

    function setBusy(button, busy, label) {
      button.disabled = busy;
      button.textContent = label;
      button.setAttribute("aria-busy", busy ? "true" : "false");
    }

    function isHttpURL(value) {
      try {
        var parsed = new URL(value);
        return parsed.protocol === "http:" || parsed.protocol === "https:";
      } catch (error) {
        return false;
      }
    }

    function normalizeURL(value) {
      var raw = value.trim();
      if (!raw) return "";
      var candidate = raw.indexOf("://") === -1 ? "https://" + raw : raw;
      try {
        var parsed = new URL(candidate);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
        return parsed.href;
      } catch (error) {
        return "";
      }
    }

    function shortCodeFrom(value) {
      var raw = value.trim();
      if (!raw) return "";
      try {
        var parts = new URL(raw).pathname.split("/").filter(Boolean);
        if (parts.length) return parts[parts.length - 1];
      } catch (error) {}
      return raw.replace(/^\/+|\/+$/g, "");
    }

    function formatDate(value) {
      var date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    async function request(url, options) {
      var response = await fetch(url, options);
      if (!response.ok) {
        var error = new Error("Request failed with " + response.status);
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    async function loadStats(code) {
      statsResult.hidden = true;
      statsEmpty.hidden = true;
      setMessage(statsStatus, "Checking clicks\u2026", false);
      setBusy(statsSubmit, true, "Checking\u2026");
      try {
        var stats = await request("/api/stats/" + encodeURIComponent(code));
        statsUrl.textContent = stats.long_url;
        if (isHttpURL(stats.long_url)) {
          statsUrl.href = stats.long_url;
        } else {
          statsUrl.removeAttribute("href");
        }
        statsClicks.textContent = String(stats.clicks);
        statsCreated.textContent = formatDate(stats.created_at);
        statsResult.hidden = false;
        setMessage(statsStatus, "", false);
      } catch (error) {
        if (error.status === 404) {
          setMessage(statsStatus, "No link found for that code.", true);
        } else {
          setMessage(statsStatus, "Stats could not be loaded. Try again.", true);
        }
      } finally {
        setBusy(statsSubmit, false, "Check clicks");
      }
    }

    shortenForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      var longURL = normalizeURL(longUrlInput.value);
      setMessage(shortenStatus, "", false);

      if (!longURL) {
        setMessage(shortenStatus, "Enter a link, for example example.com/page.", true);
        longUrlInput.focus();
        return;
      }

      setBusy(shortenSubmit, true, "Shortening\u2026");
      try {
        var data = await request("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ long_url: longURL })
        });
        shortLink.href = data.short_url;
        shortLink.textContent = data.short_url;
        shortenResult.hidden = false;
        copyButton.textContent = "Copy";
        setMessage(copyStatus, "", false);
        setMessage(shortenStatus, "Short link created.", false);
        var code = shortCodeFrom(data.short_url);
        if (code) {
          shortQR.src = "/api/qr/" + encodeURIComponent(code);
          shortQR.alt = "QR code for " + data.short_url;
          statsCodeInput.value = code;
          loadStats(code);
        }
      } catch (error) {
        if (error.status === 429) {
          setMessage(shortenStatus, "Too many links in a minute. Wait a minute, then try again.", true);
        } else if (error.status === 400) {
          setMessage(shortenStatus, "That link was rejected. Check the address and try again.", true);
        } else {
          setMessage(shortenStatus, "The link could not be saved. Check your connection and try again.", true);
        }
      } finally {
        setBusy(shortenSubmit, false, "Shorten URL");
      }
    });

    statsForm.addEventListener("submit", function (event) {
      event.preventDefault();
      var code = shortCodeFrom(statsCodeInput.value);
      if (!code) {
        setMessage(statsStatus, "Enter a short code or link first.", true);
        statsCodeInput.focus();
        return;
      }
      statsCodeInput.value = code;
      loadStats(code);
    });

    copyButton.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(shortLink.textContent);
        copyButton.textContent = "Copied";
        setMessage(copyStatus, "Link copied to clipboard.", false);
        window.clearTimeout(copyTimer);
        copyTimer = window.setTimeout(function () {
          copyButton.textContent = "Copy";
          setMessage(copyStatus, "", false);
        }, 2000);
      } catch (error) {
        setMessage(copyStatus, "Copy failed. Select the link and copy it manually.", true);
      }
    });

    syncThemeButton();
  })();
</script>
</body>
</html>
